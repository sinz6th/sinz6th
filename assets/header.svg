<svg width="880" height="190" viewBox="0 0 880 190" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="880" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#9A7B2D"/>
      <stop offset="0.5" stop-color="#E8CC7A"/>
      <stop offset="1" stop-color="#9A7B2D"/>
    </linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2E2018"/>
      <stop offset="1" stop-color="#1B130D"/>
    </linearGradient>
  </defs>

  <style>
    .rise { opacity: 0; animation: rise 1.1s cubic-bezier(.22,.61,.36,1) forwards; }
    .d1 { animation-delay: .2s; }
    .d2 { animation-delay: .5s; }
    @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    .rule { stroke-dasharray: 320; stroke-dashoffset: 320; animation: draw 1.5s ease .9s forwards; }
    @keyframes draw { to { stroke-dashoffset: 0; } }
  </style>

  <rect width="880" height="190" fill="#0A0A0A"/>

  <text class="rise d1" x="440" y="70" text-anchor="middle"
        font-family="Georgia, serif" font-size="12" letter-spacing="6"
        fill="#7A6A53">JUST</text>

  <text class="rise d2" x="440" y="122" text-anchor="middle"
        font-family="Georgia, serif" font-size="52" letter-spacing="10"
        fill="url(#gold)">HEAVENLY</text>

  <line class="rule" x1="280" y1="146" x2="600" y2="146"
        stroke="#C9A227" stroke-width="1"/>

  <rect x="0" y="174" width="880" height="16" fill="url(#wood)"/>
  <rect x="0" y="179" width="880" height="1" fill="#140D08" opacity="0.6"/>
  <rect x="0" y="185" width="880" height="1" fill="#140D08" opacity="0.4"/>
  <rect x="0" y="173" width="880" height="1" fill="#C9A227" opacity="0.5"/>
</svg>
