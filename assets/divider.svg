<svg width="880" height="26" viewBox="0 0 880 26" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="fadeL" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#C9A227" stop-opacity="0"/>
      <stop offset="1" stop-color="#C9A227" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="fadeR" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#C9A227" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#C9A227" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <style>
    .seg { stroke-dasharray: 260; stroke-dashoffset: 260; animation: d 1.4s ease forwards; }
    @keyframes d { to { stroke-dashoffset: 0; } }
    .gem { opacity: 0; animation: g 1s ease .8s forwards; }
    @keyframes g { to { opacity: 1; } }
  </style>

  <line class="seg" x1="180" y1="13" x2="420" y2="13" stroke="url(#fadeL)" stroke-width="1"/>
  <line class="seg" x1="460" y1="13" x2="700" y2="13" stroke="url(#fadeR)" stroke-width="1"/>
  <rect class="gem" x="436" y="9" width="8" height="8" transform="rotate(45 440 13)" fill="#C9A227"/>
</svg>
